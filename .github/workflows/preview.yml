# Pull requests: test the currency engine, the Firestore rules, the currency job and the referee (functions/)
# on the emulators, test the whole game end to end in a browser on the emulators, deploy the rules,
# indexes and the referee to the
# staging project, and the built site to a temporary Hosting preview channel there (its address
# is posted on the pull request). Previews never touch the live site's database or accounts. Every
# preview shares staging's one referee.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   FIREBASE_SERVICE_ACCOUNT_STAGING  the staging project's service account key JSON
#   variable FIREBASE_STAGING_PROJECT_ID       the staging project id (edictum-staging)
# Pull requests from forks get no secrets, so they get the rules test but no preview.
name: Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: Test the Firestore rules and the referee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Currency, tutorial rewards and cached content
        run: npm run test:fx
      - name: The rules, and the daily currency job on the emulator
        run: npm run test:rules
      - name: The referee on the emulators
        run: npm run test:referee
      - name: Verify generated Assembly engine
        run: node tools/build-civic.mjs --check
      - name: Guest recovery and authoritative politics
        run: npm run test:civic
      - name: Admin operations and region controls
        run: npm run test:admin

  # Each suite gets a separate runner, build, browser and emulator database. Suites reset their data,
  # so running them concurrently against one shared emulator would erase each other's fixtures.
  browser:
    name: Browser · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: civic
            name: Guest recovery and political eligibility
            script: test:civic-e2e
            functions: true
            fx: false
          - suite: signin
            name: Email and Discord sign-in
            script: test:signin
            functions: true
            fx: false
          - suite: core
            name: Core game
            script: test:e2e
            functions: true
            fx: false
          - suite: admin
            name: Admin and region access
            script: test:admin-e2e
            functions: true
            fx: false
          - suite: smoke
            name: Desktop and mobile pages
            script: test:smoke
            functions: true
            fx: false
          - suite: sync
            name: Saving and reconnecting
            script: test:sync
            functions: true
            fx: false
          - suite: startup
            name: Startup and cached updates
            script: test:startup
            functions: true
            fx: false
          - suite: edict-inbox
            name: Edict inbox and follow-ups
            script: test:edict-inbox
            functions: true
            fx: false
          - suite: unlock-links
            name: Achievement and museum links
            script: test:unlock-links
            functions: true
            fx: false
          - suite: map-development
            name: City production and map development
            script: test:map-development
            functions: true
            fx: false
          - suite: fx
            name: Foreign Exchange Bureau
            script: test:fx-e2e
            functions: true
            fx: true
          - suite: warehouse
            name: Warehouses, upgrades and storage edicts
            script: test:warehouse
            functions: true
            fx: false
          - suite: onboarding
            name: Progressive new-player feature reveals
            script: test:onboarding
            functions: true
            fx: true
          - suite: ux-polish
            name: Search, navigation memory and requirements
            script: test:ux-polish
            functions: true
            fx: false
          - suite: flag-layers
            name: Layered flag designer
            script: test:flag-layers
            functions: true
            fx: false
          - suite: currency-gameplay
            name: Currency trade and counterfeiting
            script: test:currency-gameplay
            functions: true
            fx: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            jobs/fx/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Install the referee's packages
        if: matrix.functions
        run: npm ci --prefix functions
      - name: Install the currency job's packages
        if: matrix.fx
        run: npm ci --prefix jobs/fx
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.name }}
        env:
          TEST_SCRIPT: ${{ matrix.script }}
        run: npm run "$TEST_SCRIPT"
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.suite }}-screenshots
          path: test/out/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required check name. A failed, cancelled or skipped suite must fail this
  # gate instead of making a skipped dependency look green to branch protection.
  e2e:
    name: Test the game end to end
    needs: browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser suite to pass
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [ "$BROWSER_RESULT" != "success" ]; then
            echo "::error::Browser suites did not all pass ($BROWSER_RESULT)."
            exit 1
          fi

  preview:
    name: Deploy a preview channel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING != '' }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Check the repository settings
        id: settings
        run: |
          missing=""
          [ "$HAS_SERVICE_ACCOUNT" = "true" ] || missing="$missing the secret FIREBASE_SERVICE_ACCOUNT_STAGING and"
          [ -n "$PROJECT_ID" ] || missing="$missing the variable FIREBASE_STAGING_PROJECT_ID and"
          if [ "$FROM_FORK" = "true" ]; then
            msg="No preview: this pull request comes from a fork, and GitHub does not give forks the repository's secrets."
          elif [ -n "$missing" ]; then
            msg="No preview: the repository is missing${missing% and}. Add what is missing under Settings > Secrets and variables > Actions (README.md, Owner setup, explains how)."
          fi
          if [ -n "$msg" ]; then
            echo "::warning title=Preview skipped::$msg"
            { echo "### Preview skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install the pinned packages
        if: steps.settings.outputs.ready == 'true'
        run: npm ci && npm ci --prefix functions

      - name: Build public/
        if: steps.settings.outputs.ready == 'true'
        run: python3 build.py --site-url "https://$PROJECT_ID.web.app"

      # the service account needs Cloud Functions Admin, Service Account User and Artifact Registry Reader
      # besides the roles above (README.md, Owner setup, step 5). --force: a function taken out of functions/
      # is deleted, and without the image clean-up policy (Owner setup, step 5.4) the deploy warns, not fails
      - name: Deploy the referee to staging
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force

      - name: Deploy the Firestore rules and indexes to staging
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive

      - name: Deploy to a preview channel
        if: steps.settings.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
          expires: 7d
          firebaseToolsVersion: 15.33.0
