# Pull requests: test the currency engine, the Firestore rules, the currency job and the referee (functions/)
# on the emulators, test the whole game end to end in a browser on the emulators, deploy the rules,
# indexes and the referee to the
# staging project, and the built site to a temporary Hosting preview channel there (its address
# is posted on the pull request). Previews never touch the live site's database or accounts. Every
# preview shares staging's one referee.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   FIREBASE_SERVICE_ACCOUNT_STAGING  the staging project's service account key JSON
#   variable FIREBASE_STAGING_PROJECT_ID       the staging project id (edictum-staging)
# Pull requests from forks get no secrets, so they get the rules test but no preview.
name: Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: Test the Firestore rules and the referee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Currency, tutorial rewards and cached content
        run: npm run test:fx
      - name: The rules, and the daily currency job on the emulator
        run: npm run test:rules
      - name: The referee on the emulators
        run: npm run test:referee
      - name: Admin operations and region controls
        run: npm run test:admin

  # the whole game in a browser against the Auth, Firestore, Functions and Hosting emulators (test/e2e.mjs,
  # test/smoke.mjs); a failing run keeps its screenshots as an artifact
  e2e:
    name: Test the game end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Admin console and maintenance access
        run: npm run test:admin-e2e
      - name: Smoke tests
        run: npm run test:smoke
      - name: Saving across devices and reconnecting
        run: npm run test:sync
      - name: Startup, cached updates and saved themes
        run: npm run test:startup
      - name: Edict topics, synced inbox states and follow-up recaps
        run: npm run test:edict-inbox
      - name: Achievement and museum unlock notification links
        run: npm run test:unlock-links
      - name: Install the currency job's packages
        run: npm ci --prefix jobs/fx
      - name: The currency and the Foreign Exchange Bureau in the game
        run: npm run test:fx-e2e
      - name: Currency trade, policy signals and counterfeiting
        run: npm run test:currency-gameplay
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test/out/*.png
          if-no-files-found: ignore
          retention-days: 7

  preview:
    name: Deploy a preview channel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING != '' }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Check the repository settings
        id: settings
        run: |
          missing=""
          [ "$HAS_SERVICE_ACCOUNT" = "true" ] || missing="$missing the secret FIREBASE_SERVICE_ACCOUNT_STAGING and"
          [ -n "$PROJECT_ID" ] || missing="$missing the variable FIREBASE_STAGING_PROJECT_ID and"
          if [ "$FROM_FORK" = "true" ]; then
            msg="No preview: this pull request comes from a fork, and GitHub does not give forks the repository's secrets."
          elif [ -n "$missing" ]; then
            msg="No preview: the repository is missing${missing% and}. Add what is missing under Settings > Secrets and variables > Actions (README.md, Owner setup, explains how)."
          fi
          if [ -n "$msg" ]; then
            echo "::warning title=Preview skipped::$msg"
            { echo "### Preview skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install the pinned packages
        if: steps.settings.outputs.ready == 'true'
        run: npm ci && npm ci --prefix functions

      - name: Build public/
        if: steps.settings.outputs.ready == 'true'
        run: python3 build.py --site-url "https://$PROJECT_ID.web.app"

      - name: Deploy the Firestore rules and indexes to staging
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive

      # the service account needs Cloud Functions Admin, Service Account User and Artifact Registry Reader
      # besides the roles above (README.md, Owner setup, step 5). --force: a function taken out of functions/
      # is deleted, and without the image clean-up policy (Owner setup, step 5.4) the deploy warns, not fails
      - name: Deploy the referee to staging
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force

      - name: Deploy to a preview channel
        if: steps.settings.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
          projectId: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
          expires: 7d
          firebaseToolsVersion: 15.33.0
