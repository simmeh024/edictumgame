# TEMPORARY, for branch founding-click-flake only (removed before its pull request): runs the Core game suite and the
# founding-click repro (test/founding-click-repro.mjs) on many Linux runners at once, to catch the flake where the
# founding edict's "Assent to motion I" cannot be hit (<main> intercepts pointer events) with test/hit-diag.mjs's report.
name: Founding click hunt

on:
  push:
    branches: [founding-click-flake]

permissions:
  contents: read

jobs:
  hunt:
    name: Hunt ${{ matrix.shard }} (fix ${{ matrix.first == '0' && 'off first' || 'on first' }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        first: ['0', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            jobs/fx/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix jobs/fx
      - name: Install Chromium for Playwright
        timeout-minutes: 12
        uses: ./.github/actions/playwright-chromium
      - run: python3 build.py
      # MODE=wait: the recovery dialog is closed just before the edict card is clicked, the order the flake needs;
      # FIX=0 turns off the game's modalEra, FIX=1 leaves it on
      - name: Founding click 25 times, FIX=${{ matrix.first }}
        continue-on-error: true
        timeout-minutes: 12
        env: { RUNS: '25', MODE: wait, FIX: '${{ matrix.first }}' }
        run: PATH="$PWD/node_modules/.bin:$PATH" firebase emulators:exec --project demo-edictum --only auth,firestore,functions,hosting "node test/founding-click-repro.mjs"
      - name: Founding click 25 times, FIX=${{ matrix.first == '0' && '1' || '0' }}
        continue-on-error: true
        timeout-minutes: 12
        env: { RUNS: '25', MODE: wait, FIX: "${{ matrix.first == '0' && '1' || '0' }}" }
        run: PATH="$PWD/node_modules/.bin:$PATH" firebase emulators:exec --project demo-edictum --only auth,firestore,functions,hosting "node test/founding-click-repro.mjs"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hunt-${{ matrix.shard }}-${{ matrix.first }}
          path: test/out/**/*.png
          if-no-files-found: ignore
          retention-days: 3
