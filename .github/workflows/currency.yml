# Every day, shortly after midnight UTC, the currency job values every region's currencies and rates their
# prestige (jobs/fx), writing fx/<region>, fxs/<region> and fxh/<nation> with the Admin SDK. A second run
# later in the morning is a safety net: a region already done that day is skipped, so it costs a read per
# region and changes nothing. GitHub runs scheduled workflows from the default branch only.
#
# Needs, under Settings > Secrets and variables > Actions (the same as Deploy):
#   secret   FIREBASE_SERVICE_ACCOUNT  the service account key JSON; it needs to read and write Firestore
#   variable FIREBASE_PROJECT_ID       the Firebase project id
# Run by hand (Actions > Currency > Run workflow) with target staging to use FIREBASE_SERVICE_ACCOUNT_STAGING
# and FIREBASE_STAGING_PROJECT_ID instead. Without them the workflow says so and does nothing.
name: Currency

on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project: live or staging'
        type: choice
        options: [live, staging]
        default: live

permissions:
  contents: read

concurrency:
  group: currency-${{ inputs.target || 'live' }}
  cancel-in-progress: false

jobs:
  value:
    name: Value the currencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ inputs.target == 'staging' && vars.FIREBASE_STAGING_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      HAS_SERVICE_ACCOUNT: ${{ (inputs.target == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT) != '' }}
    steps:
      - name: Check the repository settings
        id: settings
        run: |
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ] || [ -z "$PROJECT_ID" ]; then
            msg="The currency job did not run: the repository is missing the service account secret or the project id variable for this target (README.md, Owner setup)."
            echo "::warning title=Currency job skipped::$msg"
            { echo "### Currency job skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/fx/package-lock.json

      - name: Install the job's pinned packages
        if: steps.settings.outputs.ready == 'true'
        run: npm ci --prefix jobs/fx

      - name: Value every region's currencies
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ inputs.target == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" node jobs/fx/run.mjs --project "$PROJECT_ID" | tee "$RUNNER_TEMP/report.json"
          { echo "### Currencies valued"; echo; echo '```json'; cat "$RUNNER_TEMP/report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
