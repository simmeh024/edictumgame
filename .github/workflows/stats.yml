# Every day just after midnight UTC, the statistics job records how many played the day that ended (jobs/stats),
# writing statsDays/<date> with the Admin SDK for the admin portal's Statistics page. A second run later is a safety
# net: a day already recorded is left as it is. GitHub runs scheduled workflows from the default branch only.
#
# Needs, under Settings > Secrets and variables > Actions (the same as Deploy and Currency):
#   secret   FIREBASE_SERVICE_ACCOUNT  the service account key JSON; it needs to read Firestore and Authentication
#                                      and write Firestore
#   variable FIREBASE_PROJECT_ID       the Firebase project id
# Run by hand (Actions > Statistics > Run workflow) with target staging to use FIREBASE_SERVICE_ACCOUNT_STAGING
# and FIREBASE_STAGING_PROJECT_ID instead. Without them the workflow says so and does nothing.
name: Statistics

on:
  schedule:
    - cron: '7 0 * * *'
    - cron: '53 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project: live or staging'
        type: choice
        options: [live, staging]
        default: live

permissions:
  contents: read

concurrency:
  group: stats-${{ inputs.target || 'live' }}
  cancel-in-progress: false

jobs:
  record:
    name: Record the day's player statistics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ inputs.target == 'staging' && vars.FIREBASE_STAGING_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      HAS_SERVICE_ACCOUNT: ${{ (inputs.target == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT) != '' }}
    steps:
      - name: Check the repository settings
        id: settings
        run: |
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ] || [ -z "$PROJECT_ID" ]; then
            msg="The statistics job did not run: the repository is missing the service account secret or the project id variable for this target (README.md, Owner setup)."
            echo "::warning title=Statistics job skipped::$msg"
            { echo "### Statistics job skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/stats/package-lock.json

      - name: Install the job's pinned packages
        if: steps.settings.outputs.ready == 'true'
        run: npm ci --prefix jobs/stats

      - name: Record the day
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ inputs.target == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" node jobs/stats/run.mjs --project "$PROJECT_ID" | tee "$RUNNER_TEMP/report.json"
          { echo "### Player statistics recorded"; echo; echo '```json'; cat "$RUNNER_TEMP/report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
