# Every hour, the mail job sends Letters by post (jobs/mail): digests of what other nations did, development news
# and away reminders, through Resend with the key in Firestore authConfig/mail (tools/admin/set-mail.mjs). Without
# that key it says so and sends nothing. GitHub runs scheduled workflows from the default branch only.
#
# Needs, under Settings > Secrets and variables > Actions (the same as Deploy and Statistics):
#   secret   FIREBASE_SERVICE_ACCOUNT  the service account key JSON; it needs to read and write Firestore
#
#   variable FIREBASE_PROJECT_ID       the Firebase project id
# Run by hand (Actions > Mail > Run workflow) with target staging to use FIREBASE_SERVICE_ACCOUNT_STAGING
# and FIREBASE_STAGING_PROJECT_ID instead. Without them the workflow says so and does nothing.
name: Mail

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project: live or staging'
        type: choice
        options: [live, staging]
        default: live

permissions:
  contents: read

concurrency:
  group: mail-${{ inputs.target || 'live' }}
  cancel-in-progress: false

jobs:
  send:
    name: Send the hour's letters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ inputs.target == 'staging' && vars.FIREBASE_STAGING_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
      HAS_SERVICE_ACCOUNT: ${{ (inputs.target == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT) != '' }}
    steps:
      - name: Check the repository settings
        id: settings
        run: |
          if [ "$HAS_SERVICE_ACCOUNT" != "true" ] || [ -z "$PROJECT_ID" ]; then
            msg="The mail job did not run: the repository is missing the service account secret or the project id variable for this target (README.md, Owner setup)."
            echo "::warning title=Mail job skipped::$msg"
            { echo "### Mail job skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.settings.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs/mail/package-lock.json

      - name: Install the job's pinned packages
        if: steps.settings.outputs.ready == 'true'
        run: npm ci --prefix jobs/mail

      - name: Send the letters
        if: steps.settings.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ inputs.target == 'staging' && secrets.FIREBASE_SERVICE_ACCOUNT_STAGING || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" node jobs/mail/run.mjs --project "$PROJECT_ID" | tee "$RUNNER_TEMP/report.json"
          { echo "### Letters sent"; echo; echo '```json'; cat "$RUNNER_TEMP/report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
