# Every push to main builds the site and deploys it to Firebase: the Firestore rules and
# indexes first, then the referee (functions/), then Hosting (the live channel).
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   FIREBASE_SERVICE_ACCOUNT  the service account key JSON (see README.md, Owner setup)
#   variable FIREBASE_PROJECT_ID       the Firebase project id
#   variable SITE_URL                  optional: the address people use, such as https://edictum.example
# Without the first two, the workflow says so and skips the deploy, so the run stays green.
# Only main's newest commit deploys (scripts/deploy-newest.mjs): an older commit's run, such as a re-run of an earlier
# failed deploy, is skipped with a warning, so it cannot put an older build live over a newer one.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check the repository settings
        id: settings
        run: |
          missing=""
          [ "$HAS_SERVICE_ACCOUNT" = "true" ] || missing="$missing the secret FIREBASE_SERVICE_ACCOUNT and"
          [ -n "$PROJECT_ID" ] || missing="$missing the variable FIREBASE_PROJECT_ID and"
          if [ -n "$missing" ]; then
            msg="Nothing was deployed: the repository is missing${missing% and}. Add what is missing under Settings > Secrets and variables > Actions (README.md, Owner setup, explains how), then re-run this workflow."
            echo "::warning title=Deploy skipped::$msg"
            { echo "### Deploy skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.settings.outputs.ready == 'true'
        uses: actions/checkout@v7

      # Only main's newest commit goes live (scripts/deploy-newest.mjs): a re-run of an older deploy, or a run that
      # waited behind a newer merge, is skipped with a yellow warning instead of putting an older build back live.
      - name: Check that this is main's newest commit
        id: newest
        if: steps.settings.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-newest.mjs

      - name: Set up Node.js
        if: steps.settings.outputs.ready == 'true' && steps.newest.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install the pinned packages
        if: steps.settings.outputs.ready == 'true' && steps.newest.outputs.go == 'true'
        run: npm ci && npm ci --prefix functions

      - name: Build public/
        if: steps.settings.outputs.ready == 'true' && steps.newest.outputs.go == 'true'
        run: python3 build.py --site-url "${SITE_URL:-https://$PROJECT_ID.web.app}"

      # the service account needs Cloud Functions Admin, Service Account User and Artifact Registry Reader
      # besides the roles above (README.md, Owner setup, step 5). --force: a function taken out of functions/
      # is deleted, and without the image clean-up policy (Owner setup, step 5.4) the deploy warns, not fails.
      # scripts/schedule-ready.mjs first: a project without the Cloud Scheduler API or roles (step 5.2) gets the
      # functions without the schedule (homeLive) and a warning, instead of a failed deploy
      - name: Deploy the referee
        if: steps.settings.outputs.ready == 'true' && steps.newest.outputs.go == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISCORD_DISPATCH_CHANNEL_ID: ${{ vars.DISCORD_DISPATCH_CHANNEL_ID }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" node scripts/schedule-ready.mjs --project "$PROJECT_ID"
          if [ -n "$DISCORD_DISPATCH_CHANNEL_ID" ]; then
            [[ "$DISCORD_DISPATCH_CHANNEL_ID" =~ ^[0-9]{15,22}$ ]] || { echo 'Invalid Discord channel ID'; exit 1; }
            printf 'EDICTUM_DISCORD_ENABLED=true\nEDICTUM_DISCORD_CHANNEL_ID=%s\n' "$DISCORD_DISPATCH_CHANNEL_ID" >> "functions/.env.$PROJECT_ID"
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force

      - name: Deploy the Firestore rules and indexes
        if: steps.settings.outputs.ready == 'true' && steps.newest.outputs.go == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          key="$RUNNER_TEMP/service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy --only firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive

      - name: Deploy the site to Firebase Hosting
        if: steps.settings.outputs.ready == 'true' && steps.newest.outputs.go == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          firebaseToolsVersion: 15.33.0
