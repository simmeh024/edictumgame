<!doctype html>
<!-- Source of og.png (1200 x 630), the picture shown when a link to the game is shared.
     Rebuild with: node tools/make-images.mjs (needs Playwright). -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500&display=block">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#e8eeeb;color:#12292a;font-family:"Public Sans",system-ui,sans-serif;position:relative}
  .sheet{position:absolute;inset:28px;overflow:hidden;border:1px solid #b0c2bc;background:#f8fbf9;box-shadow:0 10px 26px -14px rgba(18,41,42,.28)}
  .rose{position:absolute;right:-250px;top:-150px;width:780px;height:780px;opacity:.3}
  .seal{position:absolute;left:84px;top:150px;width:300px;height:300px}
  .txt{position:absolute;left:430px;top:150px;right:80px}
  .eyebrow{font:500 20px/1.2 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#566b67;margin:0 0 18px}
  h1{margin:0;font-family:"Bodoni Moda",Didot,Georgia,serif;font-style:italic;font-weight:600;font-size:150px;line-height:1;letter-spacing:-.01em;font-variation-settings:"opsz" 96}
  p.sub{margin:30px 0 0;font-size:29px;line-height:1.4;color:#45605c;max-width:660px}
  .stamp{position:absolute;right:76px;bottom:70px;padding:8px 16px;border:3px solid #6a3db3;border-radius:4px;color:#6a3db3;font:500 19px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;transform:rotate(-4deg);opacity:.85}
</style>
</head>
<body>
<div class="sheet">
  <svg class="rose" viewBox="-200 -200 400 400" aria-hidden="true"><g id="g" fill="none" stroke="#1d6a5c" stroke-width=".6"></g></svg>
</div>
<img class="seal" src="favicon.svg" alt="">
<div class="txt">
  <p class="eyebrow">A nation simulator</p>
  <h1>Edictum</h1>
  <p class="sub">Found a nation, decide the issues on your desk, claim land and share a region with other players.</p>
</div>
<div class="stamp">Approved</div>
<script>
  /* guilloche rosette: the engraved-banknote look of the game */
  var g = document.getElementById('g'), d = '';
  for (var k = 0; k < 14; k++) {
    var r0 = 70 + k * 9, pts = [];
    for (var i = 0; i <= 720; i++) {
      var t = i / 720 * Math.PI * 2, r = r0 + 14 * Math.sin(t * 18 + k * .45) + 6 * Math.sin(t * 7 - k);
      pts.push((r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2));
    }
    d += 'M' + pts.join(' L') + 'Z';
  }
  g.innerHTML = '<path d="' + d + '"/>';
</script>
</body>
</html>
